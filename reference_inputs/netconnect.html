<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection Lost</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  body { display: flex; align-items: center; justify-content: center; }
  .icon { width: 320px; height: 320px; display: block; }
</style>
</head>
<body>

<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1920" role="img" aria-label="Internet connection lost">
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1920">
      <rect width="1920" height="1920" fill="#fff"/>
      <rect x="980" y="0" width="940" height="945" fill="#000"/>
      <path d="M1135 810L1240 705" stroke="#000" stroke-width="594" stroke-linecap="round" fill="none"/>
    </mask>

    <!-- clear halo around the radiating shards -->
    <mask id="halo" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1920">
      <rect width="1920" height="1920" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="44" stroke-linejoin="miter">
        <polygon points="1056,324 1029,399 1193,416"/>
        <polygon points="1332,96 1257,123 1350,260"/>
        <polygon points="1822,688 1849,613 1685,595"/>
        <polygon points="1546,916 1621,889 1529,752"/>
      </g>
    </mask>

    <clipPath id="neg" clipPathUnits="userSpaceOnUse"><rect x="-300" y="-400" width="1500" height="400"/></clipPath>
    <clipPath id="pos" clipPathUnits="userSpaceOnUse"><rect x="-300" y="0" width="1500" height="400"/></clipPath>
    <mask id="underB" maskUnits="userSpaceOnUse" x="-300" y="-400" width="1500" height="800">
      <rect x="-300" y="-400" width="1500" height="800" fill="#fff"/>
      <g clip-path="url(#neg)"><path d="M230 -152.5H378A152.5 152.5 0 0 1 378 152.5H230A152.5 152.5 0 0 1 230 -152.5Z" fill="none" stroke="#000" stroke-width="145"/></g>
    </mask>
    <mask id="underA" maskUnits="userSpaceOnUse" x="-300" y="-400" width="1500" height="800">
      <rect x="-300" y="-400" width="1500" height="800" fill="#fff"/>
      <g clip-path="url(#pos)"><path d="M541 -152.5H689A152.5 152.5 0 0 1 689 152.5H541A152.5 152.5 0 0 1 541 -152.5Z" fill="none" stroke="#000" stroke-width="145"/></g>
    </mask>

    <!-- fracture edges -->
    <clipPath id="lowA" clipPathUnits="userSpaceOnUse">
      <polygon points="0,-260 570,-260 570,-205 608,-152 574,-100 580,0 598,100 566,152 596,205 596,260 0,260"/>
    </clipPath>
    <clipPath id="highA" clipPathUnits="userSpaceOnUse">
      <polygon points="950,-260 950,260 678,260 678,205 648,152 680,100 662,0 656,-100 690,-152 652,-205 652,-260"/>
    </clipPath>
  </defs>

  <g mask="url(#halo)">
    <!-- Globe -->
    <g mask="url(#cut)" fill="none" stroke="#2f2d33">
      <circle cx="956" cy="981" r="670" stroke-width="77"/>
      <ellipse cx="956" cy="981" rx="334" ry="670" stroke-width="72"/>
      <path d="M957 272V1690" stroke-width="75"/>
      <path d="M400 643H1512M300 978H1612M400 1313H1512" stroke-width="73"/>
    </g>

    <!-- Chain: lower link intact, upper link snapped in two -->
    <g transform="translate(972.5 972.5) rotate(-45)" fill="none" stroke="#2f2d33" stroke-width="105">
      <path mask="url(#underA)" d="M230 -152.5H378A152.5 152.5 0 0 1 378 152.5H230A152.5 152.5 0 0 1 230 -152.5Z"/>
      <g clip-path="url(#lowA)"><path mask="url(#underB)" d="M541 -152.5H689A152.5 152.5 0 0 1 689 152.5H541A152.5 152.5 0 0 1 541 -152.5Z"/></g>
      <g transform="translate(70 0)" clip-path="url(#highA)"><path d="M541 -152.5H689A152.5 152.5 0 0 1 689 152.5H541A152.5 152.5 0 0 1 541 -152.5Z"/></g>
    </g>
  </g>

  <!-- Radiating shards -->
  <g fill="#2f2d33">
    <polygon points="1056,324 1029,399 1193,416"/>
    <polygon points="1332,96 1257,123 1350,260"/>
    <polygon points="1822,688 1849,613 1685,595"/>
    <polygon points="1546,916 1621,889 1529,752"/>
  </g>
</svg>

</body>
</html>
